name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_BASE_PATH: /napkin/
          # Emit the installable PWA (service worker + workbox precache) for
          # the deployed site only. Local test/land builds leave this unset
          # and skip the ~1300-entry precache pass — see astro.config.mjs.
          ENABLE_PWA: '1'
          # The SSR "Building static entrypoints" phase (Rollup bundling every
          # KaTeX-heavy MDX module at once) peaks around 4GB and grows with the
          # page count. The `build` npm script caps the heap at 4096 to stay
          # lean on an 8GB dev laptop; ubuntu-latest has 16GB, so we invoke
          # astro directly here with generous headroom for future growth
          # instead of `npm run build` (whose inline cap would override this).
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
